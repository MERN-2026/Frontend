<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-position</title>
    <style>
    .box {
    width: 300px;
    height: 200px;
    border: 2px solid black;
}

.box img {
    width: 100%;
    height:100% ;
    object-fit: fill;
    object-position: top;
    cursor: pointer;
    /* border-radius: 50%; */
}
    </style>
</head>
<body>
    <div class="box">
    <img src="../../../../Html/assests/MERN.jpeg" alt="Nature">
</body>
</html>
