<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-fit</title>
    <style>
        .card{
            width: 300px;
            height:200px;
            border: 2px solid black
            ;
        }
        .card img{
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-fit: contain;
            object-fit: cover;
            object-fit: none;
            object-fit: scale-down;
        }
    </style>
</head>
<body>
    <!-- It is used for <img> and <video> element  -->
        <div class="card">
    <img src="../../../Html/assests/MERN.jpeg" alt="Nature">
</div>
</body>
</html>
