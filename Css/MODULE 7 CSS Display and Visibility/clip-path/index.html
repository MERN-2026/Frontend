<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clip-path</title>
    <style>
        .box {
    width: 200px;
    height: 200px;
    background: red;
    clip-path: circle(50%);
    clip-path: ellipse(40% 30%);
    /* clip-path: polygon(0% 100%, 0% 0% , 100% 100%); */
clip-path:polygon(0% 0%, 0% 100%, 100% 100%);

}

    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
