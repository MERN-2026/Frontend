<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
    width: 600px;
    height: 300px;
    border: 2px solid black;

    display: flex;
    align-items: center;
    justify-content: center;
}

.box {
    width: 80px;
    height: 80px;
    border: 2px solid black;
}
    </style>
</head>
<body>
    <div class="container">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
</div>
</body>
</html>

<!-- justify-content = horizontal ↔️
align-items = vertical ↕️ -->
