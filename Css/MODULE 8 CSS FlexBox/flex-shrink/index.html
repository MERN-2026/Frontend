<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .container {
    width: 300px;
    display: flex;
    border: 2px solid black;
}

.box {
    width: 200px;
    height: 100px;
    border: 2px solid black;
}

.box1 {
    flex-shrink: 1;
}

.box2 {
    flex-shrink: 1;
}
    </style>
</head>
<body>
    <div class="container">
    <div class="box box1">A</div>
    <div class="box box2">B</div>
</div>
</body>
</html>

<!-- flex-grow vs flex-shrink
Property	Kab kaam karta hai?
flex-grow	Extra space ho → item bada ho
flex-shrink	Space kam ho → item chhota ho
🔥 Shortcut

Grow = jagah zyada → bada
Shrink = jagah kam → chhota -->
