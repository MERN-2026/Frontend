<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display and Visibility</title>
    <style>
        div{
            display: inline;
        }
        p{
            display: inline;
        }
        span{
            display: block;
            display: none;
        }
        .box1{
            border: 2px dashed black;
            display:inline-block ;
            padding: 20px;
            margin: 20px;
            width: 150px;
            opacity: 0;
            opacity: 0.5;
            opacity: 1;
            /* position: static; */
            /* position: relative;
            top: 40px;
            right: 40px;
            bottom:40px;
            left: 40px;
            position: absolute;
            top: 20px;
            left: 30px; */
            /* position: fixed; */
            /* position: sticky; */
            z-index: 1;
        }
        .box2{
            border: 2px dashed black;
            display:inline-block ;
            padding: 20px;
            margin: 20px;
            width: 150px;
            opacity: 0;
            opacity: 0.5;
            opacity: 1;
            /* position: static; */
            /* position: relative;
            top: 40px;
            right: 40px;
            bottom:40px;
            left: 40px;
            position: absolute;
            top: 20px;
            left: 30px; */
            /* position: fixed; */
            /* position: sticky; */
            z-index: 2;
        }
        .visibility{
            visibility: visible;
            visibility: hidden;
        }
        
    </style>
</head>
<body>
    <div class="visibility">one </div>
     <div class="box1">One</div>
    <div class="box2">Two</div>


    <div>
        <h1>Amru</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Assumenda dignissimos inventore iste ducimus, praesentium facere, perspiciatis atque id nulla soluta vitae. Dicta, facere. Inventore facere numquam consequuntur repellendus provident?</p>
    </div>
    <span>One</span>
    <span>Two</span>
    <span>Three</span>
   
</body>
</html>
