    <h1>Application Form</h1>

        </label>
        <label for="sd">
            <input type="radio" id="sd" name="Position Available" value="Senior Developer">Senior Developer
        </label>

        <label title="programming language" >Programming Language:</label>

        </label>
        <input type="checkbox" name="Programming Language" value="Java Script" id="java script">
        <label for="java script" title="java script">Java Script
        </label>
        <input type="checkbox" name="Programming Language" value="Python" id="python">
        <label for="python" title="python" >Python
        </label>

        <label for="pass" title="password">Password:</label>

        <label for="conpass" title="confirm password">Confirm Password:</label>
        <input type="password" id="conpass" title="confirm password" name="Confirm Password">
        <br><br>
        <input type="submit" title="submit">
        <input type="reset">
    </form>
