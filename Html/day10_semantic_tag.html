Semantic Tags List

| Tag         | Work                |
| ----------- | ------------------- |
| `<header>`  | Website ka top part |
| `<nav>`     | Navigation links    |
| `<main>`    | Main content        |
| `<section>` | Ek section          |
| `<article>` | Independent content |
| `<aside>`   | Sidebar             |
| `<footer>`  | Bottom part         |

Semantic HTML ke Benefits

2. SEO

3. Accessibility

Screen readers visually impaired users ke liye better kaam karte hain.

4. Easy Maintenance

Badi website me code organize rehta hai.

-->

Interview Question
Q. Semantic HTML kya hota hai?
