<!-- 

next topic: <details> + <summary>

Ye dono bahut simple aur useful hain.

📚 <details> Tag
Definition — English 🇬🇧

The <details> element creates a disclosure widget that the user can open and close to view additional information.

Simple Hinglish:

<details> ka use aisa content banane ke liye hota hai jo click karne par open aur close ho.

📚 <summary> Tag
Definition — English 🇬🇧

The <summary> element specifies the visible heading or label for a <details> element.

Simple:

<summary> wo visible heading/question hota hai jise user click karta hai.

🔥 Basic Example
<details>

    <summary>What is HTML?</summary>

    <p>HTML is used to structure web pages.</p>

</details>

Initially:

▶ What is HTML?

Click karne ke baad:

▼ What is HTML?

  HTML is used to structure web pages.

Again click:

▶ What is HTML?

Content hide ho jayega.

🧠 Relationship

Sabse important:

DETAILS
│
└── SUMMARY
    │
    └── Hidden/Expandable Content

<summary> normally <details> ke andar hota hai.

🔥 FAQ Example

Real website me bahut use hota hai:

<h2>Frequently Asked Questions</h2>

<details>
    <summary>What is MERN?</summary>
    <p>MERN stands for MongoDB, Express, React and Node.js.</p>
</details>

<details>
    <summary>How long is the course?</summary>
    <p>The course duration is 6 months.</p>
</details>

<details>
    <summary>Is the course offline?</summary>
    <p>Yes, offline classes are available.</p>
</details>

Concept:

FAQ
│
├── ▶ What is MERN?
├── ▶ How long is the course?
└── ▶ Is the course offline?

User jis question par click karega, sirf wahi answer open hoga.

🔥 open Attribute

Agar tum chahte ho ki page load hote hi details already open ho:

<details open>

    <summary>What is HTML?</summary>

    <p>HTML is a markup language.</p>

</details>

Result:

▼ What is HTML?

  HTML is a markup language.

open bhi ek boolean attribute hai.

🧠 Important Difference
<details>
     ↓
Container / expandable area

<summary>
     ↓
Clickable heading

Content
     ↓
Jo open/close hota hai
Interview Answer

What is <details>?

The <details> element creates an expandable and collapsible section containing additional information.

What is <summary>?

The <summary> element defines the visible heading or label of a <details> element.


-->
