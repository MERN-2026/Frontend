<!DOCTYPE html><!--Describe the version of HTML , This IS the version of HTML-5 -->
<html lang="en"><!--This is the root element of the HTML document.
                    Everything on the webpage is placed inside this tag.
                    lang="en" tells browsers and search engines that the page language is English.
                    It also helps screen readers pronounce words correctly.-->
<head> <!--The <head> section contains information about the webpage, not the content that users see.
It includes:
Title
Meta information
CSS files
JavaScript files
Icons

Everything inside <head> helps the browser understand the page.-->
    <meta charset="UTF-8"><!---<meta charset="UTF-8">
        UTF-8,UTF-16,UTF-32,UTF-64
    The full form of UTF = Unicode Transformation Format
This specifies the character encoding used by the webpage.
UTF-8 supports almost all characters and symbols from languages around the world.

Examples:

English letters
தமிழ்
हिंदी
中文
😊

Without UTF-8, some characters may display incorrectly.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Viewport Meta Tag

This makes the webpage responsive on different screen sizes.

Let's break it down:

name="viewport"
Refers to the visible area of the webpage on a device.
width=device-width
Sets the page width equal to the width of the user's device.

For example:

Mobile → about 390px
Tablet → about 768px
Laptop → about 1366px
initial-scale=1.0
Sets the initial zoom level to 100% when the page first loads.

Without this tag, mobile browsers might zoom out and make the page appear too small.-->
    <title>Document</title>
    <!--<title>
Sets the title of the webpage.
This title appears:
On the browser tab
In bookmarks
In search engine results-->
</head>
<!--Closes the head section.-->
<body>
    <!--The <body> contains everything that is visible to the user.

Examples:

Headings
Paragraphs
Images
Videos
Buttons
Tables
Forms
Links-->
</body>
<!--closes the body section -->

</html>
<!--Closes the Root tag-->
<!--Closes the HTML document.
Marks the end of the webpage.-->

    <!-- 1️⃣ HTML Element kya hai?
Definition — English 🇬🇧

An HTML element is a complete HTML structure consisting of a start tag, content, and an end tag, or a self-closing/void tag.

Example:

<p>Hello World</p>

Yahan:

<p>          → Start tag
Hello World  → Content
</p>         → End tag

Pura <p>Hello World</p> = Element

Void element

Kuch elements ka closing tag nahi hota:

<img>
<br>
<hr>
<input>

Inhe void elements kehte hain.

2️⃣ HTML Attribute kya hai?
Definition — English 🇬🇧

An HTML attribute provides additional information or configuration for an HTML element.

Simple:

Attribute element ke baare me extra information deta hai ya uska behavior configure karta hai.

Example:

<input type="text" placeholder="Enter your name">

Yahan:

input       → Element
type        → Attribute
"text"      → Attribute value

placeholder → Attribute
"Enter..."  → Attribute value

Structure:

attribute="value"
🔥 Tum already bahut attributes padh chuke ho

Example:

<a href="about.html" target="_blank">
href       → attribute
target     → attribute

Image:

<img src="photo.jpg" alt="Student Photo" width="300">
src   → attribute
alt   → attribute
width → attribute

Form:

<input type="email" required maxlength="50">
type      → attribute
required  → attribute
maxlength → attribute

So attribute koi alag tag nahi hai.

3️⃣ Block-Level Element
Definition — English 🇬🇧

A block-level element normally starts on a new line and takes up the available width of its containing element.

Simple:

Block element new line se start hota hai aur normally available width occupy karta hai.

Example:

<h1>Heading</h1>
<p>Paragraph</p>

Browser concept:

[             Heading             ]

[             Paragraph           ]

Dono alag lines me.

Common Block-Level Elements

Abhi ke HTML knowledge se:

<h1> - <h6>
<p>
<div>
<ul>
<ol>
<li>
<table>
<form>
<section>
<article>
<header>
<footer>
<main>
<aside>
<nav>
<hr>

⚠️ display CSS se behavior change kiya ja sakta hai, isliye ise HTML ka permanent/fixed rule mat samajhna.

4️⃣ Inline Element
Definition — English 🇬🇧

An inline element normally does not start on a new line and takes up only as much width as its content requires.

Simple:

Inline element same line me reh sakta hai aur normally jitni jagah content ko chahiye utni hi width leta hai.

Example:

<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Contact</a>

Concept:

Home    About    Contact

Same line.

Common Inline Elements
<a>
<span>
<strong>
<em>
<b>
<i>
<label>
<img>
🔥 Block vs Inline — Direct Difference
Block	Inline
Normally new line se start	Normally same line me continue
Available width occupy kar sakta hai	Content jitni width
<p>	<a>
<div>	<span>
<section>	<strong>
<article>	<em>
<h1>	<img>
🧠 Ek simple example
<p>Hello</p>
<p>World</p>

<a href="#">Google</a>
<a href="#">GitHub</a>

Output concept:

Hello
World

Google GitHub

Kyun?

<p>       → Block
<p>       → Block

<a>       → Inline
<a>       → Inline
🔥 <div> aur <span> bhi yaad rakho

Ye dono bahut important hain.

<div>

Normally block-level generic container.

<div>
    <h2>Student</h2>
    <p>Amrutanshu</p>
</div>
<span>

Normally inline generic container.

<p>
    My name is <span>Amrutanshu</span>.
</p>

CSS me baad me in dono ka bahut use karenge.
