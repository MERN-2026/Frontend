<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div | span</title>
</head>
<body>
      <div>
    <h2>Student Profile</h2>
    <p>Name: Amrutanshu</p>
    <p>Course: MERN</p>
<!-- The <div> element is a generic block-level container used to group and organize other HTML elements. -->

    <!-- The <span> element is a generic inline container used to group or style a small portion of text or other inline content. -->

<p>
    My name is <span>Amrutanshu</span>.
</p>

<!-- Agar content ka specific semantic meaning hai, to appropriate semantic tag use karo.

<div> tab useful hai jab:

Sirf grouping/container chahiye aur koi specific semantic meaning nahi hai.

🧠 Easy Trick

Yaad rakho:

DIV   → BIG/GROUP CONTAINER
SPAN  → SMALL/INLINE CONTAINER

Example:

DIV
 ↓
[Heading]
[Paragraph]
[Image]
[Button]


SPAN
 ↓
"Hello [World]!"
       ↑
     small part
Interview answer:

What is the difference between div and span?

<div> is a generic block-level container, while <span> is a generic inline container. -->
</div>
</body>
</html>
