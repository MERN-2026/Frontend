📚 HTML Entities
Definition — English 🇬🇧

HTML entities are special codes used to display reserved characters and special symbols in an HTML document.

Simple Hinglish:

HTML me kuch characters ka special meaning hota hai. Unhe directly likhne ke bajay hum HTML entity use kar sakte hain.

1️⃣ &copy;

Copyright symbol:

&copy;

Output:

©

Example:

<p>&copy; 2026 My Website</p>
2️⃣ &lt;

Less-than symbol:

&lt;

Output:

<

Agar tum webpage par literally < dikhana chahte ho, &lt; use kar sakte ho.

3️⃣ &gt;

Greater-than symbol:

&gt;

Output:

>

🔥 < aur > ko entity kyun?

HTML me:

<p>

me < aur > HTML tags ko define karte hain.

Agar tum user ko literally ye dikhana chaho:

<p>

to:

&lt;p&gt;

likh sakte ho.

Browser output:

<p>
4️⃣ &nbsp;
Full form:

NBSP = Non-Breaking Space

Ye special space create karta hai.

Hello&nbsp;&nbsp;&nbsp;World

Output:

Hello   World

Normal HTML me multiple spaces generally collapse ho jaate hain.

5️⃣ &amp;

Ampersand symbol:

&amp;

Output:

&

Example:

<p>HTML &amp; CSS</p>

Output:

HTML & CSS
6️⃣ Quotes

Double quote:

&quot;

Output:

"

Single quote:

&apos;

Output:

'

🧠 Important Entities Cheat Sheet
Entity	Output	Meaning
&copy;	©	Copyright
&lt;	<	Less than
&gt;	>	Greater than
&amp;	&	Ampersand
&nbsp;	space	Non-breaking space
&quot;	"	Double quote
&apos;	'	Apostrophe
Easy rule 🔥

HTML entity generally:

&something;

se start/end hoti hai.

Example:

&copy;
&lt;
&gt;
&amp;

likh sakte ho. -->
