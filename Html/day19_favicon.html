    <!-- next topic: Favicon

🌐 Favicon
Definition — English 🇬🇧

A favicon is a small icon associated with a website, usually displayed in the browser tab next to the page title.

Simple Hinglish:

Favicon wo chhota icon hai jo browser tab me website ke title ke paas dikhta hai.

Example:

┌──────────────────────────────────────┐
│ 🌐 Achievers IT | Home       +       │
└──────────────────────────────────────┘
   ↑
 Favicon
🔥 Favicon kaise add kare?

Favicon ko <head> ke andar add karte hain:

<link rel="icon" href="favicon.png">

Example complete:

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Achievers IT | Home</title>

    <link rel="icon" href="favicon.png">

</head>
Yahan:
<link>       → external resource ko HTML se connect karta hai
rel="icon"   → batata hai ki resource favicon hai
href         → favicon file ka path
📁 File kaha rakhen?

Agar structure:

MyProject
│
├── index.html
└── favicon.png

To:

<link rel="icon" href="favicon.png">

Agar images folder me hai:

MyProject
│
├── index.html
└── images
    └── favicon.png

To:

<link rel="icon" href="images/favicon.png">
🖼️ Kaunse image formats?

Commonly:

.ico
.png
.svg

Example:

<link rel="icon" href="favicon.ico">

or

<link rel="icon" href="images/logo.png">
🧠 Important

Favicon <body> me nahi, normally <head> me add hota hai.

HTML
│
├── HEAD
│   ├── title
│   ├── meta
│   └── favicon  ← yahan
│
└── BODY
Interview definition:

A favicon is a small icon displayed in the browser tab to represent a website or webpage.
