    <!-- 📚 <iframe> Tag
Definition — English 🇬🇧

The <iframe> element is used to embed another webpage or external content inside the current webpage.

Simple Hinglish:

<iframe> ka use kisi doosri webpage ya external content ko apni webpage ke andar dikhane ke liye hota hai.

🔥 Basic Example
<iframe src="https://example.com"></iframe>

Concept:

Your Website
┌─────────────────────────────┐
│                             │
│     Another Website         │
│     inside your page        │
│                             │
└─────────────────────────────┘
🎯 Real-life use
1. YouTube video

YouTube se Share → Embed karne par iframe code mil sakta hai.

<iframe
    src="https://www.youtube.com/embed/VIDEO_ID"
    width="560"
    height="315">
</iframe>
2. Google Maps

Website ke contact page par map embed kar sakte ho:

CONTACT PAGE
│
├── Address
├── Phone
├── Email
└── Google Map

Map ke liye iframe commonly use hota hai.

3. Another webpage
<iframe
    src="https://example.com"
    width="600"
    height="400">
</iframe>
🧠 Important Attributes
src

Definition:

Specifies the URL of the content to be embedded.

<iframe src="page.html"></iframe>

src batata hai kya load karna hai.

width

Iframe ki width:

<iframe src="page.html" width="600"></iframe>
height

Iframe ki height:

<iframe src="page.html" height="400"></iframe>
🔥 Example
<iframe
    src="https://example.com"
    width="600"
    height="400"
    title="Example Website">
</iframe>

Yahan:

iframe     → element
src        → kya content load karna hai
width      → width
height     → height
title      → embedded content ka description
⚠️ Ek important baat

Har website ko iframe ke andar load nahi kar sakte.

Kuch websites security reasons ki wajah se iframe embedding block kar deti hain.

Isliye agar:

<iframe src="some-website.com"></iframe>

kaam nahi kare, zaroori nahi ki tumhara HTML galat hai.

🧠 Interview Answer

What is an iframe?

An iframe is an HTML element used to embed another webpage or external content within the current webpage. -->

<iframe src="" frameborder="0"></iframe>
