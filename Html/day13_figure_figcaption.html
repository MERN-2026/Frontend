<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig | figcaption</title>
</head>
<body>
    <figure>
    <img src="mern.jpg" alt="MERN Stack Course">
    <figcaption>MERN Stack Development Course</figcaption>
</figure>

<figure>

    <pre>
        console.log("Hello");
    </pre>

    <figcaption>Example JavaScript code</figcaption>

</figure>
<!-- <pre> ka full form hai:

PRE = Preformatted Text

Matlab pehle se formatted text — spaces aur line breaks ko preserve karta hai.

<pre>
Hello
    World
        HTML
</pre>

👉 PRE = Preformatted Text. -->
</body>
</html>
