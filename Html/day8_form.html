<!--1️⃣ required Attribute (Masterclass)
Syntax
<input type="text" required>
required kya hai?

👉 required ek boolean attribute hai.

Boolean attribute ka matlab:

Agar attribute likh diya → ON
Agar nahi likha → OFF

Example:

<input type="text" required>

Ya

<input type="text" required="required">

Dono same hain.

required kyu use karte hain?

Jab tum chahte ho ki user ye field bharna hi pade, tab required use karte hain.

Example:

Registration Form

<label for="name">Name</label>

<input
id="name"
type="text"
required>

Agar user Name khali chhodkar Submit karega,

Browser bolega:

Please fill out this field.

Form submit nahi hoga.

Without required
<input type="text">

User kuch bhi na likhe aur Submit kare.

✔ Form submit ho jayega.

With required
<input type="text" required>

User khali chhod de.

❌ Form submit nahi hoga.

Real-Time Examples
Login Form
<label for="email">Email</label>

<input
id="email"
type="email"
required>

Email bharna zaroori hai.

Password
<label for="password">Password</label>

<input
id="password"
type="password"
required>

Password bhi mandatory hai.

Complete Example
<form action="success.html">

<label for="name">Name</label>
<input
id="name"
type="text"
required>

<br><br>

<label for="email">Email</label>
<input
id="email"
type="email"
required>

<br><br>

<input type="submit">

</form>
Kis-kis ke saath use hota hai?

<input type="email" required>

✔ Radio

✔ Checkbox

<input type="checkbox" required>
Interview Definition

The required attribute makes an input field mandatory. The browser prevents form submission until the user fills the field.

Yaad Rakhne ki Trick

Required = Mandatory

<!--| Attribute      | Use                              |
| -------------- | -------------------------------- |
| `required`     | Field mandatory                  |
| `readonly`     | Read only, submit hota hai       |
| `disabled`     | Disable, submit nahi hota        |
| `maxlength`    | Maximum characters               |
| `minlength`    | Minimum characters               |
| `min`          | Minimum number/date              |
| `max`          | Maximum number/date              |
| `step`         | Number increment                 |
| `checked`      | Default radio/checkbox selected  |
| `selected`     | Default dropdown option          |
| `multiple`     | Multiple files/options select    |
| `accept`       | File type restriction            |
| `autocomplete` | Browser suggestions on/off       |
| `autofocus`    | Cursor automatically us field me |
