<!--🎯 Interview Definitions
name

The name attribute identifies a form field and is used to send data to the server when the form is submitted.

value

The value attribute specifies the value of an input field or the data sent to the server for selected options like radio buttons, checkboxes, and dropdowns.

🧠 Easy Trick

Think of it like a dictionary (key-value pair):

name = key

value = value

Example:

username = Amrutanshu

email = abc@gmail.com

gender = Male

course = mern

Yahan:

username, email, gender, course → name
Amrutanshu, abc@gmail.com, Male, mern → value-->
