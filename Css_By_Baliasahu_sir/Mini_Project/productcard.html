<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <style>
        .product-card{
            
            background-color: rgb(216, 220, 220);
            width: 400px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 20px;
            font-family: Georgia, 'Times New Roman', Times, serif;

        }
        h2{
            color: blueviolet;
        }
        button{
            border-radius: 5px;
            background-color: blue;
            color: rgb(185, 185, 206);
            cursor: pointer;
        }
    button:hover{
        background-color: rgb(97, 97, 200);
    }
    </style>
</head>
<body>
    <main>
        <section class="product-card">
            <h2>Laptop</h2>
            <p>Most powerfull multi tasking gaming laptop</p>
            <h3>$80000</h3>
            <button>Buy Now</button>
        </section>
        <section class="product-card">
            <h2>Mobile</h2>
            <p>Most powerfull multi tasking gaming Mobile</p>
            <h3>$40000</h3>
            <button>Buy Now</button>
        </section>
        <section class="product-card">
            <h2>Shoe</h2>
            <p>Comortable running shoe</p>
            <h3>$1000</h3>
            <button>Buy Now</button>
        </section>
    </main>
</body>
</html>
