<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. Arithmetic Operators

        let a=10;
        let b=5;

        console.log(a+b);
        console.log(a-b);
        console.log(a*b);
        console.log(a/b);
        console.log(a%b);
        console.log(a**b);

        // 2.Assignment Operators

        console.log(a+=b);
        console.log(a-=b);
        console.log(a*=b);
        console.log(a/=b);
        console.log(a%=b);
        console.log(a**=b);
        
        // 3 — Comparison Operators

        console.log(10<5);
        console.log(10>5);
        console.log(10<=5);
        console.log(10>=5);
        console.log(10=="8");
        console.log(10!=6);
        console.log("10"!=="10");
        console.log("10" ==="10");

       //4 — Logical Operators

       console.log(true && true);
       console.log(false || false);
       console.log(!false);
    
       //5 — Increment & Decrement Operators
       let x=2;
       x++;
       console.log(x);
       --x;
       console.log(x);
       
       let y=5;
       console.log(y--);
       console.log(--y);
       
       //6 — Ternary Operator ?  :
       let age = 20;
       let result = age >= 18 ? "Adult" : "Minor";
       console.log(result);

       let aj= 30;
       let res=aj<=40?"Big":"Small";
       console.log(res);

       //Direct console.log
       let kj= 40;
       console.log(kj<=50 ? "Big": "Small");

        //⚠️ Nested Ternary

        let mark = 55;

        let resu = mark >= 80 ? "Excellent" : mark>=60 ? "Good" : "Average";
        console.log(resu);

        //7 — Operator Precedence

        let re = (10+5)*2;
        console.log(re);

        // 🧠 Basic Precedence Order
//         1. ()
// 2. **
// 3. *, /, %
// 4. +, -
// 5. Comparison
// 6. Logical
// 7. Ternary
// 8. Assignment
    </script>
</body>
</html>
